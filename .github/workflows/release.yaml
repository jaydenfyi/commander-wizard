name: Release

on:
  push:
    branches: ['main']

permissions: {} # each job defines its own permissions explicitly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release in flight

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          package-manager-cache: false # nub has its own cache; avoid poisoned npm cache
      # exact-pinned tool bootstrap; nub never runs in the publish job
      - name: Install nub # zizmor: ignore[adhoc-packages]
        run: npm install -g @nubjs/nub@0.6.0 --ignore-scripts
      - name: Install dependencies
        run: nub ci --ignore-scripts
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Version
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to commit version changes (changesets/action/version)
      pull-requests: write # to create the Version Packages PR
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          package-manager-cache: false # nub has its own cache; avoid poisoned npm cache
      - name: Install nub # zizmor: ignore[adhoc-packages]
        run: npm install -g @nubjs/nub@0.6.0 --ignore-scripts
      - name: Install dependencies
        run: nub ci --ignore-scripts
      - name: Create or update release pull request
        id: version
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }} # for changelog-github PR links

  pack:
    name: Pack
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          package-manager-cache: false # nub has its own cache; avoid poisoned npm cache
      - name: Install nub # zizmor: ignore[adhoc-packages]
        run: npm install -g @nubjs/nub@0.6.0 --ignore-scripts
      - name: Install dependencies
        run: nub ci --ignore-scripts
      - name: Build package
        run: nub run build
      - name: Pack package
        id: pack
        uses: changesets/action/pack@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-latest
    environment: release # waits for a required reviewer's approval before anything touches npm
    timeout-minutes: 20
    permissions:
      contents: write # to push the vX tag and create the GitHub Release (changesets/action/publish)
      id-token: write # for npm trusted publishing
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          package-manager-cache: false # nub has its own cache; avoid poisoned npm cache
      # exact-pinned tool bootstrap; only @changesets/cli from the lockfile runs here —
      # the published bytes come from the pack job's artifact, built under read-only permissions
      - name: Install nub # zizmor: ignore[adhoc-packages]
        run: npm install -g @nubjs/nub@0.6.0 --ignore-scripts
      - name: Install dependencies
        run: nub ci --ignore-scripts
      - name: Publish package
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
